id: code-cagr
track: coding
prompt: |
  Write a Python function cagr(start, end, years) that returns the compound
  annual growth rate as a decimal fraction: (end/start)**(1/years) - 1.
  Standard library only. Return only the code.
grader:
  type: code_exec
  assertions: |
    assert abs(cagr(100, 200, 1) - 1.0) < 1e-9
    assert abs(cagr(100, 100, 5) - 0.0) < 1e-9
    assert abs(cagr(100, 121, 2) - 0.10) < 1e-9
  timeout_s: 20
source: "deterministic unit test; CAGR definition (author-defined, 2026-06-22)"
samples: 5
